<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Payment Comérsio</title>
<link rel="stylesheet" href="style.css">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
  @font-face{
    font-family: 'OswaldBold';
    src: url('oswald-bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }
  @font-face{
    font-family: 'FiraCondBold';
    src: url('firasanscondensed-bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
  }
  @font-face{
    font-family: 'FiraCondBook';
    src: url('firasanscondensed-book.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
  }

  :root{
    --emas: #e8b13c;
    --emas-terang: #ffd166;
    --gelap: #0a0a0a;
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    font-family: 'FiraCondBook', sans-serif;
    background: #0a0a0a !important;
    color: #ffffff;
    overflow-x: hidden;
  }

  /* BACKGROUND LAYER & DIM EFFECT */
  .bg-layer{
    position: fixed;
    inset: 0;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg-dim{
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 7, 0.82);
    z-index: 1;
  }

  /* TOP BAR M-BANKING */
  .mbanking-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: rgba(10, 14, 11, 0.95);
    border-bottom: 1px solid rgba(232, 177, 60, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 20;
    backdrop-filter: blur(8px);
  }

  .mbanking-brand-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .mbanking-brand {
    font-family: 'OswaldBold', sans-serif;
    font-size: 1.1rem;
    color: #ffffff;
    letter-spacing: 0.5px;
    line-height: 1.1;
  }

  .mbanking-brand span {
    color: var(--emas-terang);
  }

  .mbanking-greeting-top {
    font-size: 0.7rem;
    color: var(--emas-terang);
    font-family: 'FiraCondBold', sans-serif;
    margin-top: 1px;
    line-height: 1;
  }

  .content-wrap {
    position: relative;
    z-index: 5;
    padding: 76px 16px 60px 16px;
    max-width: 480px;
    margin: 0 auto;
  }

  /* KOTAK BILL UTAMA */
  #captureArea {
    background: rgba(12, 17, 13, 0.95);
    border: 2px solid var(--emas);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 6px 25px rgba(0,0,0,0.7);
  }

  /* HEADER BOX: LOGO + TEKS SEJAJAR DI TENGAH, DILANJUT BILLING DI BAWAHNYA */
  div.headerBox {
    all: unset !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    text-align: center !important;
    width: 100% !important;
    border-bottom: 1px solid rgba(255, 209, 102, 0.2) !important;
    padding-bottom: 15px !important;
    margin-bottom: 15px !important;
    background: transparent !important;
    box-shadow: none !important;
  }

  .headerTopRow {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }

  .mainLogo {
    width: 40px !important;
    height: 40px !important;
    object-fit: contain !important;
    border-radius: 50% !important;
    border: 1px solid var(--emas-terang) !important;
    margin: 0 !important;
    background: transparent !important;
    cursor: default;
  }

  .headerRight {
    all: unset !important;
    display: flex !important;
    flex-direction: column !important;
    text-align: left !important;
  }

  .headerRight h1 {
    font-family: 'OswaldBold', sans-serif !important;
    font-size: 1.25rem !important;
    color: #ffffff !important;
    margin: 0 !important;
    padding: 0 !important;
    letter-spacing: 0.5px;
    background: transparent !important;
  }

  .headerRight h1 span {
    color: var(--emas-terang);
  }

  .headerBillingSub {
    font-family: 'FiraCondBold', sans-serif;
    font-size: 0.78rem;
    color: var(--emas-terang);
    margin-top: 4px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .paymentInfo {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 15px;
    font-size: 0.85rem;
    color: var(--emas-terang);
    font-family: 'FiraCondBold', sans-serif;
  }

  .paymentInfoRight {
    text-align: right;
    color: #bbb;
    font-size: 0.78rem;
  }

  .paymentInfo p {
    margin: 0;
  }

  /* KOTAK STRUK GABUNGAN (SINGLE RECEIPT BOX) */
  .receiptBox {
    background: #0d120f;
    border: 1px solid rgba(232, 177, 60, 0.3);
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
  }

  .receiptRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    padding: 6px 0;
    border-bottom: 1px dashed rgba(255, 209, 102, 0.15);
  }

  .receiptRow:last-child {
    border-bottom: none;
  }

  /* TOTAL AKHIR BOX */
  .totalDebtBox {
    background: #000000;
    border: 2px solid var(--emas-terang);
    padding: 12px 14px;
    border-radius: 12px;
    font-family: 'FiraCondBold', sans-serif;
    margin-top: 15px;
    display: flex;
    justify-content: space-between;
    color: var(--emas-terang);
    font-size: 0.95rem;
  }

  /* PAYMENT METHOD BOX */
  .paymentList {
    margin-top: 15px;
    background: #0d120f;
    border: 1px solid rgba(232, 177, 60, 0.3);
    border-radius: 14px;
    padding: 15px;
  }

  .paymentHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .paymentHeaderLeft {
    color: #fff;
    font-size: 0.9rem;
    font-family: 'FiraCondBold', sans-serif;
  }

  .paymentHeaderRight {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .paymentHeaderRight img {
    width: 50px;
    object-fit: contain;
  }

  .paymentHeaderRight span {
    color: var(--emas-terang);
    font-size: 0.9rem;
    font-family: 'FiraCondBold', sans-serif;
  }

  .paymentInfoText {
    color: #aaa;
    font-size: 0.8rem;
    margin-bottom: 12px;
    text-align: center;
  }

  .paymentCard {
    background: #000000;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--emas);
    text-align: center;
    color: white;
    font-family: 'FiraCondBold', sans-serif;
  }

  /* KOTAK QRIS KOTAK KAKU TANPA LENGKUNGAN */
  .qrisContainer {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #ffffff;
    padding: 8px;
    border-radius: 0px !important;
    border: none !important;
    max-width: 176px;
    margin: 0 auto;
  }

  .qrisImage {
    width: 160px;
    height: 160px;
    object-fit: contain;
    border-radius: 0px !important;
    display: block;
  }

  /* TOMBOL SIMPAN */
  .saveButton {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 12px;
    margin-top: 20px;
    background: var(--emas-terang);
    color: black;
    font-size: 0.95rem;
    font-family: 'FiraCondBold', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(255, 209, 102, 0.3);
    transition: transform 0.2s;
  }

  .saveButton:active {
    transform: scale(0.98);
  }

  .noCapture {
    z-index: 99;
  }
</style>
</head>

<body>

  <div class="bg-layer"></div>
  <div class="bg-dim"></div>

  <!-- TOP BAR M-BANKING -->
  <div class="mbanking-topbar">
    <div class="mbanking-brand-container">
      <div class="mbanking-brand">Comersio <span>Center</span></div>
      <div class="mbanking-greeting-top">Detail Pembayaran</div>
    </div>
  </div>

  <div class="content-wrap" style="padding-top: 70px;">
    <!-- AREA BILL -->
    <div id="captureArea">
      <div class="headerBox">
        <div class="headerTopRow">
          <img src="icon.png" class="mainLogo" alt="Logo">
          <div class="headerRight">
            <h1>COMÉRSIO <span>CENTER</span></h1>
          </div>
        </div>
        <div class="headerBillingSub">Billing</div>
      </div>

      <div class="customerListBox">
        <h2 style="font-family: 'FiraCondBold', sans-serif; color: var(--emas-terang); font-size: 1.1rem; margin-bottom: 8px;">
          STRUK PEMBAYARAN
        </h2>

        <div class="paymentInfo">
          <div>
            <p id="paymentCustomerId"></p>
          </div>
          <div class="paymentInfoRight">
            <p id="livePaymentTime"></p>
          </div>
        </div>

        <!-- STRUK GABUNGAN (SINGLE RECEIPT BOX) -->
        <div class="receiptBox" id="paymentListSimple"></div>

        <div class="totalDebtBox">
          <span>TOTAL AKHIR :</span>
          <span>Rp <span id="paymentTotal">0</span></span>
        </div>

        <div id="paymentContent"></div>
      </div>
    </div>

    <!-- TOMBOL SIMPAN -->
    <button class="saveButton noCapture" onclick="saveAsImage()">
      SIMPAN BILL PEMBAYARAN
    </button>
  </div>

<script>
/* =========================
   STORAGE & RENDER BILL
========================= */
const customer = localStorage.getItem("paymentCustomer") || "-";
const total = localStorage.getItem("paymentTotal") || "0";
const method = localStorage.getItem("paymentMethod") || "qris";
const paymentMode = localStorage.getItem("paymentMode") || "full";

const debts = JSON.parse(localStorage.getItem("debts")) || {};

document.getElementById("paymentCustomerId").innerText = `ID : ${customer}`;

function updateLivePaymentTime(){
    const now = new Date();
    const day = String(now.getDate()).padStart(2,"0");
    const month = String(now.getMonth()+1).padStart(2,"0");
    const year = now.getFullYear();
    const hours = String(now.getHours()).padStart(2,"0");
    const minutes = String(now.getMinutes()).padStart(2,"0");
    const seconds = String(now.getSeconds()).padStart(2,"0");

    document.getElementById("livePaymentTime").innerText = `${day}/${month}/${year} • ${hours}:${minutes}:${seconds}`;
}

updateLivePaymentTime();
setInterval(updateLivePaymentTime, 1000);

document.getElementById("paymentTotal").innerText = parseInt(total || 0).toLocaleString("id-ID");

const list = document.getElementById("paymentListSimple");
const customerDebt = debts[customer] || [];

let productNames = [];
let totalHutangGabungan = 0;
let totalDibayarGabungan = 0;

customerDebt.forEach(item => {
    const harga = item.harga || 0;
    const dibayar = item.dibayar || 0;
    const sisa = harga - dibayar;

    if(sisa > 0){
        productNames.push(item.produk);
        totalHutangGabungan += harga;
        totalDibayarGabungan += dibayar;
    }
});

const gabunganProdukStr = productNames.length > 0 ? productNames.join(", ") : "-";
const sisaTagihanGabungan = totalHutangGabungan - totalDibayarGabungan;

let statusPembayaran = (paymentMode === 'amort') ? "Amortisasi" : "Full";
let statusColor = (paymentMode === 'amort') ? "#ffb703" : "#4caf5e";

if(productNames.length > 0){
    list.innerHTML = `
        <div class="receiptRow">
            <span style="color:#aaa;">Produk</span>
            <span style="font-family: 'FiraCondBold', sans-serif; text-align: right; max-width: 60%;">${gabunganProdukStr}</span>
        </div>
        <div class="receiptRow">
            <span style="color:#aaa;">Total Hutang</span>
            <span>Rp ${totalHutangGabungan.toLocaleString("id-ID")}</span>
        </div>
        <div class="receiptRow">
            <span style="color:#aaa;">Sudah Dibayar</span>
            <div style="text-align: right;">
                <span style="color: var(--emas-terang);">Rp ${totalDibayarGabungan.toLocaleString("id-ID")}</span>
                <div style="margin-top: 2px;">
                    <span style="background: ${statusColor}; color: #000; padding: 1px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; display: inline-block;">Status: ${statusPembayaran}</span>
                </div>
            </div>
        </div>
        <div class="receiptRow" style="border-top: 1px solid rgba(255,209,102,0.2); margin-top: 4px; padding-top: 8px;">
            <span style="font-family: 'FiraCondBold', sans-serif;">Sisa Tagihan</span>
            <span style="font-family: 'FiraCondBold', sans-serif; color: #ff5555;">Rp ${sisaTagihanGabungan.toLocaleString("id-ID")}</span>
        </div>
    `;
} else {
    list.innerHTML = `<p style="text-align:center; color:#777; padding: 10px; margin:0;">Tidak ada rincian utang aktif.</p>`;
}

const paymentData = {
    qris:{ logo:"QRIS Logo.png", name:"QRIS", type:"qris" },
    gopay:{ logo:"GoPay.png", name:"GoPay", type:"ewallet", number:"083874854586", owner:"An E•• P••••••" },
    dana:{ logo:"DANA.png", name:"DANA", type:"ewallet", number:"081226672073", owner:"An E•• P••••••" },
    shopeepay:{ logo:"ShopeePay.png", name:"ShopeePay", type:"ewallet", number:"083874854586", owner:"An E•• P••••••" },
    seabank:{ logo:"SeaBank.png", name:"SeaBank", type:"bank", number:"901677273030", owner:"An E•• P••••••" },
    bri:{ logo:"Bank BRI.png", name:"BRI", type:"bank", number:"696101033719531", owner:"An E•• P••••••" },
    bankjago:{ logo:"Bank Jago.png", name:"Bank Jago", type:"bank", number:"100626307457", owner:"An E•• P••••••" },
    krom:{ logo:"Krom.png", name:"Krom", type:"bank", number:"770015012050", owner:"An E•• P••••••" }
};

const pay = paymentData[method] || paymentData["qris"];
let infoText = pay.type === "qris" ? "Scan QR Code di bawah ini untuk melakukan pembayaran" : "Salin nomor di bawah ini untuk melakukan pembayaran";

const content = document.getElementById("paymentContent");

if(pay.type === "qris"){
    content.innerHTML = `
    <div class="paymentList">
        <div class="paymentHeader">
            <div class="paymentHeaderLeft">Metode Pembayaran</div>
            <div class="paymentHeaderRight">
                <img src="${pay.logo}" alt="QRIS">
                <span>${pay.name}</span>
            </div>
        </div>
        <div class="paymentInfoText">${infoText}</div>
        <div class="paymentCard">
            <div class="qrisContainer">
                <img src="QRIS.png" class="qrisImage" alt="QR Code">
            </div>
            <p style="margin: 10px 0 0 0; font-size: 0.8rem; color: #ccc;">Scan Menggunakan QRIS (All Banking & E-Wallet)</p>
        </div>
    </div>
    `;
} else {
    content.innerHTML = `
    <div class="paymentList">
        <div class="paymentHeader">
            <div class="paymentHeaderLeft">Metode Pembayaran</div>
            <div class="paymentHeaderRight">
                <img src="${pay.logo}" alt="${pay.name}">
                <span>${pay.name}</span>
            </div>
        </div>
        <div class="paymentInfoText">${infoText}</div>
        <div class="paymentCard">
            <span style="font-size: 1.1rem; color: var(--emas-terang);">${pay.number}</span>
            <br>
            <span style="font-size: 0.8rem; color: #aaa;">a.n. ${pay.owner}</span>
        </div>
    </div>
    `;
}

function saveAsImage(){
    const button = document.querySelector(".saveButton");
    button.innerText = "Memproses Gambar...";

    html2canvas(document.getElementById("captureArea"), {
        scale: 3,
        useCORS: true,
        backgroundColor: "#000000"
    }).then(canvas => {
        const link = document.createElement("a");
        link.download = `Bill-Comersio-${customer}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        button.innerText = "SIMPAN BILL PEMBAYARAN";
    }).catch(err => {
        alert("Gagal menyimpan gambar.");
        button.innerText = "SIMPAN BILL PEMBAYARAN";
    });
}
</script>
</body>
</html>
