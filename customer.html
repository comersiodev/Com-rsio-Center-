<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Comérsio</title>
    <link rel="stylesheet" href="style.css">
    <style>
      @font-face{
        font-family: 'OswaldBold';
        src: url('oswald-bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
      }
      @font-face{
        font-family: 'FiraCondBold';
        src: url('firasanscondensed-bold.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
      }
      @font-face{
        font-family: 'FiraCondBook';
        src: url('firasanscondensed-book.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
      }

      :root{
        --emas: #e8b13c;
        --emas-terang: #ffd166;
        --gelap: #000000;
      }

      *{
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body{
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        font-family: 'FiraCondBook', sans-serif;
        background: var(--gelap) !important;
        color: #ffffff;
        overflow-x: hidden;
      }

      body{
        background-color: var(--gelap) !important;
      }

      /* =========================
         UI NAVBAR DRAWER & STYLING
      ========================= */
      .navbar {
        position: fixed;
        top: 0;
        left: -300px;
        width: 280px;
        height: 100%;
        background: #000000;
        border-right: 2px solid var(--emas-terang);
        z-index: 999999;
        transition: left 0.3s ease;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }

      .navbar.active {
        left: 0;
      }

      .closeNavbar {
        align-self: flex-end;
        font-size: 1.3rem;
        color: var(--emas-terang);
        cursor: pointer;
        margin-bottom: 10px;
        font-family: 'FiraCondBold', sans-serif;
      }

      .navbarHeader {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 15px;
        border-bottom: 1px solid rgba(255, 209, 102, 0.2);
        margin-bottom: 15px;
      }

      .navLogo {
        width: 45px;
        height: 45px;
        object-fit: contain;
        border-radius: 50%;
        border: 1px solid var(--emas-terang);
      }

      .navText p {
        margin: 0;
        font-size: 0.85rem;
      }

      #navUsername {
        font-family: 'FiraCondBold', sans-serif;
        color: var(--emas-terang);
        font-size: 1rem;
      }

      #navEmail, #navTitle {
        color: #aaa;
        font-size: 0.75rem;
      }

      .navbarMenu {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
      }

      .navMenuBox {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #0b0f0c;
        border: 1px solid rgba(255, 209, 102, 0.3);
        padding: 12px 14px;
        border-radius: 12px;
        text-decoration: none;
        color: #ffffff;
        font-family: 'FiraCondBold', sans-serif;
        font-size: 0.9rem;
        transition: all 0.2s ease;
      }

      .navMenuBox:hover {
        background: #151d16;
        border-color: var(--emas-terang);
      }

      .navMenuBox img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }

      /* OVERLAY */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        display: none;
        z-index: 99999;
      }

      .overlay.active {
        display: block;
      }

      /* =========================
         HEADER BOX (PRESISI SEPERTI PAYMENT.HTML)
      ========================= */
      .content-wrap {
        position: relative;
        z-index: 5;
        padding: 20px 16px 60px 16px;
        max-width: 600px;
        margin: 0 auto;
      }

      div.headerBox {
        all: unset !important;
        display: flex !important;
        align-items: center !important;
        gap: 12px !important;
        width: 100% !important;
        border-bottom: 1px solid rgba(255, 209, 102, 0.2) !important;
        padding-bottom: 12px !important;
        margin-bottom: 15px !important;
        background: transparent !important;
        box-shadow: none !important;
      }

      .mainLogo {
        width: 40px !important;
        height: 40px !important;
        object-fit: contain !important;
        border-radius: 50% !important;
        border: 1px solid var(--emas-terang) !important;
        margin: 0 !important;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .headerRight h1 {
        font-family: 'OswaldBold', sans-serif !important;
        font-size: 1.3rem !important;
        color: #ffffff !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .headerRight h1 span {
        color: var(--emas-terang);
      }

      .headerRight p {
        color: #aaa;
        font-size: 0.8rem;
        margin: 2px 0 0 0;
      }

      /* =========================
         CUSTOMER LIST CONTAINER
      ========================= */
      .customer-list-container {
        max-width: 600px;
        margin: 0 auto;
      }

      .customer-card {
        background: #000000;
        border: 2px solid var(--emas-terang);
        border-radius: 16px;
        margin-bottom: 16px;
        padding: 18px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 15px rgba(255, 209, 102, 0.15);
      }

      .customer-info h3 {
        margin: 0 0 4px 0;
        font-family: 'FiraCondBold', sans-serif;
        font-size: 1.1rem;
        color: var(--emas-terang);
      }

      .customer-info p {
        margin: 0 0 4px 0;
        font-size: 0.9rem;
        color: #fff;
      }

      .customer-info small {
        color: #aaa;
        font-size: 0.8rem;
      }

      .customer-stats {
        text-align: right;
        font-family: 'FiraCondBold', sans-serif;
      }

      .customer-stats .total-tx {
        font-size: 0.85rem;
        color: #aaa;
        margin-bottom: 4px;
      }

      .customer-stats .total-val {
        font-size: 0.95rem;
        color: var(--emas-terang);
      }

      .add-customer-btn {
        display: block;
        width: 100%;
        margin: 15px auto 40px auto;
        height: 48px;
        background: var(--emas-terang);
        color: #000000;
        border: 2px solid var(--emas-terang);
        border-radius: 12px;
        font-family: 'FiraCondBold', sans-serif;
        font-size: 0.95rem;
        cursor: pointer;
        text-align: center;
        line-height: 44px;
      }

      .popupBox{
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        padding: 20px;
      }

      .popupBox.active{
        display: flex;
      }

      .popupContent{
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 400px;
        background: #000;
        border: 2px solid var(--emas-terang);
        border-radius: 20px;
        padding: 24px;
      }

      .popupContent h2 {
        margin-top: 0;
        margin-bottom: 6px;
        font-family: 'FiraCondBold', sans-serif;
        color: var(--emas-terang);
        font-size: 1rem;
      }

      input{
        width: 100%;
        height: 50px;
        background: #111;
        border: 2px solid var(--emas-terang);
        border-radius: 14px;
        color: white;
        padding: 0 16px;
        box-sizing: border-box;
        margin-bottom: 14px;
        font-family: 'FiraCondBook', sans-serif;
      }

      .popupButtonGroup{
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .cancelButton,
      .addButton{
        flex: 1;
        height: 48px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-family: 'FiraCondBold', sans-serif;
      }

      .cancelButton{
        background: #2a2a2a;
        color: white;
      }

      .addButton{
        background: var(--emas-terang);
        color: black;
      }
    </style>
</head>

<body>

<!-- =========================
     NAVBAR DRAWER
========================= -->
<div id="navbar" class="navbar">
    <div class="closeNavbar" onclick="toggleNavbar()">✕</div>
    
    <div class="navbarHeader">
        <img src="icon.png" class="navLogo">
        <div class="navText">
            <p id="navUsername"></p>
            <p id="navEmail"></p>
            <p id="navTitle"></p>
        </div>
    </div>

    <div class="navbarMenu">
        <a href="index.html" class="navMenuBox"><img src="icon.png"><span>Home</span></a>
        <a href="product.html" class="navMenuBox"><img src="voucher.png"><span>Produk</span></a>
        <a href="debt.html" class="navMenuBox"><img src="debt.png"><span>Utang</span></a>
        <a href="customer.html" class="navMenuBox"><img src="nama.png"><span>Customer</span></a>
        <a href="recap.html" class="navMenuBox"><img src="rekap.png"><span>Rekap Utang</span></a>
        <a href="monthly.html" class="navMenuBox"><img src="pembukuan.png"><span>Laporan Bulanan</span></a>
    </div>
</div>

<div id="overlay" class="overlay" onclick="toggleNavbar()"></div>

<div class="content-wrap">
    <!-- HEADER BOX PRESISI PERSIS PAYMENT.HTML -->
    <div class="headerBox">
        <div class="headerLeft">
            <img src="icon.png" class="mainLogo" id="rotatingLogo" onclick="handleNavbarTrigger()" title="Buka Menu Navbar">
        </div>
        <div class="headerRight">
            <h1>DATA <span>CUSTOMER</span></h1>
            <p>Daftar customer & total tagihan aktif.</p>
        </div>
    </div>

    <div class="customer-list-container">
        <div id="customerList"></div>

        <button class="add-customer-btn" onclick="openPopup()">
            + TAMBAHKAN CUSTOMER BARU
        </button>
    </div>
</div>

<div id="popupBox" class="popupBox">
    <div class="popupContent">
        <h2>ID CUSTOMER</h2>
        <input type="text" id="customerId" placeholder="Masukkan ID Customer mu disini...">

        <h2>NAMA CUSTOMER</h2>
        <input type="text" id="customerName" placeholder="Masukkan nama customer disini...">

        <div class="popupButtonGroup">
            <button class="cancelButton" onclick="closePopup()">Cancel</button>
            <button class="addButton" onclick="addCustomer()">Tambahkan</button>
        </div>
    </div>
</div>

<script>
document.getElementById("navUsername").innerText = localStorage.getItem("username") || "Unknown User";
document.getElementById("navEmail").innerText = localStorage.getItem("email") || "No Email";
document.getElementById("navTitle").innerText = localStorage.getItem("title") || "No Title";

function toggleNavbar(){
    document.getElementById("navbar").classList.toggle("active");
    document.getElementById("overlay").classList.toggle("active");
}

let clickState = 0;

function handleNavbarTrigger(){
    const logo = document.getElementById("rotatingLogo");
    
    if(clickState === 0){
        clickState = 1;
        logo.style.transform = "rotate(180deg)";
    } else if(clickState === 1){
        clickState = 2;
        logo.style.transform = "rotate(360deg)";
        
        setTimeout(() => {
            logo.style.transition = "none";
            logo.style.transform = "rotate(0deg)";
            clickState = 0;
            setTimeout(() => { logo.style.transition = "transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)"; }, 50);
        }, 400);
    }

    toggleNavbar();
}

function openPopup(){
    document.getElementById("popupBox").classList.add("active");
}

function closePopup(){
    document.getElementById("popupBox").classList.remove("active");
}

window.onload = function(){
    renderCustomerList();
}

function renderCustomerList(){
    const customers = JSON.parse(localStorage.getItem("customers")) || [];
    const debts = JSON.parse(localStorage.getItem("debts")) || {};
    const list = document.getElementById("customerList");
    list.innerHTML = "";

    if(customers.length === 0){
        list.innerHTML = `<p style="text-align:center; color:#777; padding: 20px;">Belum ada customer terdaftar.</p>`;
        return;
    }

    customers.forEach(data => {
        const custId = data.id;
        const custName = data.name;
        const custDebts = debts[custId] || [];

        let totalTxCount = custDebts.length;
        let totalDebtAmount = 0;

        custDebts.forEach(item => {
            const harga = item.harga || 0;
            const dibayar = item.dibayar || 0;
            const sisa = harga - dibayar;
            if(sisa > 0){
                totalDebtAmount += sisa;
            }
        });

        const card = document.createElement("div");
        card.classList.add("customer-card");

        card.innerHTML = `
            <div class="customer-info">
                <h3>ID : ${custId}</h3>
                <p>${custName}</p>
                <small>Jumlah Transaksi: ${totalTxCount} item</small>
            </div>
            <div class="customer-stats">
                <div class="total-tx">Total Tagihan</div>
                <div class="total-val">Rp ${totalDebtAmount.toLocaleString("id-ID")}</div>
            </div>
        `;

        list.appendChild(card);
    });
}

function addCustomer(){
    const id = document.getElementById("customerId").value.trim();
    const name = document.getElementById("customerName").value.trim();

    if(id === "" || name === ""){
        alert("Lengkapi ID dan Nama Customer!");
        return;
    }

    const customers = JSON.parse(localStorage.getItem("customers")) || [];

    if(customers.some(c => c.id === id)){
        alert("ID Customer sudah terdaftar!");
        return;
    }

    customers.push({ id: id, name: name });

    localStorage.setItem("customers", JSON.stringify(customers));

    document.getElementById("customerId").value = "";
    document.getElementById("customerName").value = "";

    closePopup();
    renderCustomerList();
}
</script>

</body>
</html>
