<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Comérsio</title>
    <link rel="stylesheet" href="style.css">
    <style>
      @font-face{
        font-family: 'OswaldBold';
        src: url('oswald-bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
      }
      @font-face{
        font-family: 'FiraCondBold';
        src: url('firasanscondensed-bold.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
      }
      @font-face{
        font-family: 'FiraCondBook';
        src: url('firasanscondensed-book.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
      }

      :root{
        --emas: #e8b13c;
        --emas-terang: #ffd166;
        --gelap: #0a0a0a;
      }

      *{
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html, body{
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        font-family: 'FiraCondBook', sans-serif;
        background: #0a0a0a !important;
        color: #ffffff;
        overflow-x: hidden;
      }

      /* BACKGROUND LAYER & DIM EFFECT */
      .bg-layer{
        position: fixed;
        inset: 0;
        background-image: url('background.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        z-index: 0;
      }

      .bg-dim{
        position: fixed;
        inset: 0;
        background: rgba(6, 10, 7, 0.82);
        z-index: 1;
      }

      /* TOP BAR M-BANKING */
      .mbanking-topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: rgba(10, 14, 11, 0.95);
        border-bottom: 1px solid rgba(232, 177, 60, 0.25);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        z-index: 20;
        backdrop-filter: blur(8px);
      }

      .mbanking-brand-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .mbanking-brand {
        font-family: 'OswaldBold', sans-serif;
        font-size: 1.1rem;
        color: #ffffff;
        letter-spacing: 0.5px;
        line-height: 1.1;
      }

      .mbanking-brand span {
        color: var(--emas-terang);
      }

      .mbanking-greeting-top {
        font-size: 0.7rem;
        color: var(--emas-terang);
        font-family: 'FiraCondBold', sans-serif;
        margin-top: 1px;
        line-height: 1;
      }

      .topbar-right-box {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .date-badge-top {
        font-family: 'FiraCondBold', sans-serif;
        font-size: 0.8rem;
        color: var(--emas-terang);
        background: rgba(232, 177, 60, 0.1);
        border: 1px solid rgba(232, 177, 60, 0.3);
        padding: 4px 8px;
        border-radius: 8px;
      }

      .profile-circle-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid var(--emas-terang);
        background: #121814;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      }

      .profile-circle-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 0 12px rgba(255, 209, 102, 0.4);
      }

      .profile-circle-btn svg, .profile-circle-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .profile-circle-btn svg {
        width: 20px;
        height: 20px;
        fill: var(--emas-terang);
        padding: 2px;
      }

      /* =========================
         CONTENT WRAP
      ========================= */
      .content-wrap {
        position: relative;
        z-index: 5;
        padding: 76px 16px 100px 16px;
        max-width: 600px;
        margin: 0 auto;
      }

      /* =========================
         CUSTOMER LIST CONTAINER
      ========================= */
      .customer-list-container {
        max-width: 600px;
        margin: 0 auto;
      }

      .customer-card {
        background: rgba(12, 17, 13, 0.92);
        border: 2px solid var(--emas);
        border-radius: 16px;
        margin-bottom: 14px;
        padding: 16px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        transition: border-color 0.2s;
      }

      .customer-card:hover {
        border-color: var(--emas-terang);
      }

      .customer-info h3 {
        margin: 0 0 3px 0;
        font-family: 'FiraCondBold', sans-serif;
        font-size: 1.05rem;
        color: var(--emas-terang);
      }

      .customer-info p {
        margin: 0 0 3px 0;
        font-size: 0.9rem;
        color: #fff;
      }

      .customer-info small {
        color: #aaa;
        font-size: 0.75rem;
      }

      .customer-stats {
        text-align: right;
        font-family: 'FiraCondBold', sans-serif;
      }

      .customer-stats .total-tx {
        font-size: 0.75rem;
        color: #aaa;
        margin-bottom: 2px;
      }

      .customer-stats .total-val {
        font-size: 0.9rem;
        color: var(--emas-terang);
      }

      .add-customer-btn {
        display: block;
        width: 100%;
        margin: 15px auto 20px auto;
        height: 46px;
        background: var(--emas-terang);
        color: #000000;
        border: 2px solid var(--emas-terang);
        border-radius: 12px;
        font-family: 'FiraCondBold', sans-serif;
        font-size: 0.95rem;
        cursor: pointer;
        text-align: center;
        line-height: 42px;
        box-shadow: 0 3px 10px rgba(255, 209, 102, 0.3);
      }

      .popupBox{
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.85);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        padding: 20px;
        backdrop-filter: blur(5px);
      }

      .popupBox.active{
        display: flex;
      }

      .popupContent{
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 360px;
        background: #0d120f;
        border: 2px solid var(--emas-terang);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      }

      .popupContent h2 {
        margin-top: 0;
        margin-bottom: 6px;
        font-family: 'FiraCondBold', sans-serif;
        color: var(--emas-terang);
        font-size: 0.85rem;
        text-transform: uppercase;
      }

      input{
        width: 100%;
        height: 44px;
        background: #000;
        border: 1.5px solid var(--emas);
        border-radius: 10px;
        color: white;
        padding: 0 12px;
        box-sizing: border-box;
        margin-bottom: 12px;
        font-family: 'FiraCondBook', sans-serif;
        font-size: 0.95rem;
        outline: none;
      }

      input:focus {
        border-color: var(--emas-terang);
        box-shadow: 0 0 8px rgba(255, 209, 102, 0.25);
      }

      .popupButtonGroup{
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .cancelButton,
      .addButton{
        flex: 1;
        height: 42px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-family: 'FiraCondBold', sans-serif;
        font-size: 0.9rem;
      }

      .cancelButton{
        background: #222;
        color: #aaa;
        border: 1px solid #444;
      }

      .addButton{
        background: var(--emas-terang);
        color: black;
        box-shadow: 0 3px 10px rgba(255, 209, 102, 0.3);
      }

      /* BOTTOM NAVBAR M-BANKING (7 TOMBOL) */
      .mbanking-bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 64px;
        background: rgba(10, 14, 11, 0.96);
        border-top: 1px solid rgba(232, 177, 60, 0.3);
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        z-index: 99999;
        backdrop-filter: blur(8px);
      }

      .nav-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: #888;
        font-family: 'FiraCondBold', sans-serif;
        font-size: 0.55rem;
        gap: 3px;
        padding: 4px 0;
        transition: color 0.2s;
      }

      .nav-item img {
        width: 20px;
        height: 20px;
        object-fit: contain;
        filter: grayscale(100%) opacity(0.6);
        transition: filter 0.2s;
      }

      .nav-item.active, .nav-item:hover {
        color: var(--emas-terang);
      }

      .nav-item.active img, .nav-item:hover img {
        filter: none;
      }
    </style>
</head>

<body>

  <div class="bg-layer"></div>
  <div class="bg-dim"></div>

  <!-- TOP BAR M-BANKING -->
  <div class="mbanking-topbar">
    <div class="mbanking-brand-container">
      <div class="mbanking-brand">Comersio <span>Center</span></div>
      <div class="mbanking-greeting-top">Data Customer</div>
    </div>
    <div class="topbar-right-box">
      <div class="date-badge-top" id="dateText">01 Jan 2026</div>
      <a href="profile.html" class="profile-circle-btn" id="topProfileBtn" title="Pengaturan Profile">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
      </a>
    </div>
  </div>

<div class="content-wrap">
    <div class="customer-list-container">
        <div id="customerList"></div>

        <button class="add-customer-btn" onclick="openPopup()">
            + TAMBAHKAN CUSTOMER BARU
        </button>
    </div>
</div>

<div id="popupBox" class="popupBox">
    <div class="popupContent">
        <h2>ID CUSTOMER</h2>
        <input type="text" id="customerId" placeholder="Masukkan ID Customer mu disini...">

        <h2>NAMA CUSTOMER</h2>
        <input type="text" id="customerName" placeholder="Masukkan nama customer disini...">

        <div class="popupButtonGroup">
            <button class="cancelButton" onclick="closePopup()">Batal</button>
            <button class="addButton" onclick="addCustomer()">Tambahkan</button>
        </div>
    </div>
</div>

<!-- BOTTOM NAVBAR M-BANKING (7 TOMBOL) -->
<nav class="mbanking-bottom-nav">
    <a href="index.html" class="nav-item">
        <img src="icon.png" alt="Home">
        <span>Home</span>
    </a>
    <a href="product.html" class="nav-item">
        <img src="voucher.png" alt="Produk">
        <span>Produk</span>
    </a>
    <a href="debt.html" class="nav-item">
        <img src="debt.png" alt="Utang">
        <span>Utang</span>
    </a>
    <a href="customer.html" class="nav-item active">
        <img src="nama.png" alt="Customer">
        <span>Customer</span>
    </a>
    <a href="recap.html" class="nav-item">
        <img src="rekap.png" alt="Rekap">
        <span>Rekap</span>
    </a>
    <a href="monthly.html" class="nav-item">
        <img src="pembukuan.png" alt="Laporan">
        <span>Laporan</span>
    </a>
    <a href="profile.html" class="nav-item" title="Pengaturan Profil">
        <svg viewBox="0 0 24 24" style="width:20px; height:20px; fill:currentColor; filter:none;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
        <span>Profil</span>
    </a>
</nav>

<script>
function openPopup(){
    document.getElementById("popupBox").classList.add("active");
}

function closePopup(){
    document.getElementById("popupBox").classList.remove("active");
}

window.onload = function(){
    updateDateOnly();
    renderCustomerList();

    const savedPic = localStorage.getItem("profile_picture") || localStorage.getItem("user_avatar");
    if(savedPic) {
      const topBtn = document.getElementById("topProfileBtn");
      topBtn.innerHTML = `<img src="${savedPic}" alt="Profile">`;
    }
}

function updateDateOnly(){
    const now = new Date();
    const optionsDate = { day: '2-digit', month: 'short', year: 'numeric' };
    document.getElementById("dateText").innerText = now.toLocaleDateString('id-ID', optionsDate);
}

function renderCustomerList(){
    const customers = JSON.parse(localStorage.getItem("customers")) || [];
    const debts = JSON.parse(localStorage.getItem("debts")) || {};
    const list = document.getElementById("customerList");
    list.innerHTML = "";

    if(customers.length === 0){
        list.innerHTML = `<p style="text-align:center; color:#777; padding: 20px;">Belum ada customer terdaftar.</p>`;
        return;
    }

    customers.forEach(data => {
        const custId = data.id;
        const custName = data.name;
        const custDebts = debts[custId] || [];

        let totalTxCount = custDebts.length;
        let totalDebtAmount = 0;

        custDebts.forEach(item => {
            const harga = item.harga || 0;
            const dibayar = item.dibayar || 0;
            const sisa = harga - dibayar;
            if(sisa > 0){
                totalDebtAmount += sisa;
            }
        });

        const card = document.createElement("div");
        card.classList.add("customer-card");

        card.innerHTML = `
            <div class="customer-info">
                <h3>ID : ${custId}</h3>
                <p>${custName}</p>
                <small>Jumlah Transaksi: ${totalTxCount} item</small>
            </div>
            <div class="customer-stats">
                <div class="total-tx">Total Tagihan</div>
                <div class="total-val">Rp ${totalDebtAmount.toLocaleString("id-ID")}</div>
            </div>
        `;

        list.appendChild(card);
    });
}

function addCustomer(){
    const id = document.getElementById("customerId").value.trim();
    const name = document.getElementById("customerName").value.trim();

    if(id === "" || name === ""){
        alert("Lengkapi ID dan Nama Customer!");
        return;
    }

    const customers = JSON.parse(localStorage.getItem("customers")) || [];

    if(customers.some(c => c.id === id)){
        alert("ID Customer sudah terdaftar!");
        return;
    }

    customers.push({ id: id, name: name });

    localStorage.setItem("customers", JSON.stringify(customers));

    document.getElementById("customerId").value = "";
    document.getElementById("customerName").value = "";

    closePopup();
    renderCustomerList();
}
</script>

</body>
</html>
