<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comersio Center</title>
<link rel="stylesheet" href="style.css">
<!-- Panggil Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<!-- Daftarkan Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(() => console.log("Comersio Center siap offline!"))
      .catch(err => console.log("Gagal daftar sw:", err));
  }
</script>
<style>
  @font-face{
    font-family: 'OswaldBold';
    src: url('oswald-bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBold';
    src: url('firasanscondensed-bold.otf') format('opentype');
    font-weight: 700;
    font-style: normal;
  }

  @font-face{
    font-family: 'FiraCondBook';
    src: url('firasanscondensed-book.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
  }

  :root{
    --hijau: #2f6b3a;
    --hijau-terang: #4caf5e;
    --emas: #e8b13c;
    --emas-terang: #ffd166;
    --gelap: #0b0f0c;
  }

  *{
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'FiraCondBook', sans-serif;
    touch-action: pan-y;
  }

  body{
    position: relative;
    width: 100%;
    height: 100vh;
    background: #0a0a0a;
  }

  .bg-layer{
    position: fixed;
    inset: 0;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }

  .bg-dim{
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 7, 0.68);
    z-index: 1;
  }

  #screen-welcome{
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 48px;
    overflow-y: auto;
    transition: transform 0.45s cubic-bezier(.22,.61,.36,1), opacity 0.4s ease;
  }

  #screen-welcome.slide-out{
    transform: translateX(-100%);
    opacity: 0;
    pointer-events: none;
  }

  .title{
    font-family: 'OswaldBold', sans-serif;
    text-align: center;
    font-size: 1.7rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    margin: 0;
    padding: 0 20px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    color: #ffffff;
  }

  .title .emas{ color: var(--emas-terang); }

  .welcome-text{
    font-family: 'FiraCondBook', sans-serif;
    margin-top: auto;
    margin-bottom: auto;
    text-align: center;
    color: #f2f2f2;
    font-size: 1.05rem;
    line-height: 1.6;
    padding: 0 34px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.7);
  }

  .welcome-text .accent{
    font-family: 'FiraCondBold', sans-serif;
    color: var(--emas-terang);
    font-weight: 700;
  }

  .welcome-text .accent-swipe{
    font-family: 'FiraCondBold', sans-serif;
    color: var(--emas-terang);
    font-weight: 700;
  }

  .swipe-hint{
    margin-bottom: 50px;
    display: flex;
    gap: 2px;
    justify-content: center;
  }

  .swipe-hint span{
    font-size: 2.4rem;
    font-weight: 800;
    color: var(--emas);
    animation: blinkArrow 1.4s ease-in-out infinite;
    text-shadow: 0 0 12px rgba(255, 209, 102, 0.55);
  }

  .swipe-hint span:nth-child(1){ animation-delay: 0s; }
  .swipe-hint span:nth-child(2){ animation-delay: 0.18s; }
  .swipe-hint span:nth-child(3){ animation-delay: 0.36s; }

  @keyframes blinkArrow{
    0%, 100% { opacity: 0.25; transform: scale(0.9); color: var(--emas); }
    50% { opacity: 1; transform: scale(1.08); color: var(--emas-terang); }
  }

  #screen-menu{
    position: fixed;
    inset: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    padding-top: 48px;
    transform: translateX(100%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.45s cubic-bezier(.22,.61,.36,1), opacity 0.4s ease;
    overflow-y: auto;
  }

  #screen-menu.slide-in{
    transform: translateX(0);
    opacity: 1;
    pointer-events: auto;
  }

  .menu-wrap{
    margin-top: auto;
    margin-bottom: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    align-items: flex-start;
    padding-left: 20px;
    padding-right: 20px;
  }

  .menu-btn{
    font-family: 'FiraCondBold', sans-serif;
    display: flex;
    align-items: center;
    gap: 12px;
    width: auto;
    min-width: 220px;
    max-width: 280px;
    text-decoration: none;
    text-align: left;
    color: #f5f5f5;
    background: #000000;
    border: 2px solid var(--emas-terang);
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 0.9rem;
    font-weight: 500;
    line-height: 1.35;
    box-shadow: 0 0 0 rgba(232, 177, 60, 0);
    transition: box-shadow 0.25s ease, border-color 0.25s ease;
    cursor: pointer;
    -webkit-user-drag: none;
    user-select: none;
  }

  .menu-btn img{
    width: 22px;
    height: 22px;
    object-fit: contain;
  }

  .menu-btn.bounce{
    animation: bounceClick 0.5s cubic-bezier(.36,1.7,.4,1.1);
  }

  @keyframes bounceClick{
    0%   { transform: scale(1); }
    30%  { transform: scale(0.9); }
    55%  { transform: scale(1.12); }
    75%  { transform: scale(0.96); }
    100% { transform: scale(1); }
  }

  .menu-btn:hover{
    border-color: var(--emas);
    box-shadow: 0 0 18px rgba(255, 209, 102, 0.25);
  }

  .back-hint{
    font-family: 'FiraCondBook', sans-serif;
    margin-top: auto;
    margin-bottom: 30px;
    color: #cfcfcf;
    font-size: 0.8rem;
    opacity: 0.7;
    text-align: center;
    padding: 0 30px;
  }
</style>
</head>
<body>

  <div class="bg-layer"></div>
  <div class="bg-dim"></div>

  <!-- SCREEN 1: WELCOME (DASHBOARD) -->
  <div id="screen-welcome">
    <h1 class="title">Comersio - <span class="emas">Center</span></h1>

    <div class="welcome-text">
      Pusat Hitungan termasuk hutang customer dihitung.
      <br><br>
      <span class="accent-swipe">Swipe</span> ke kiri untuk membuka menu navigasi & pengaturan data.
    </div>

    <div class="swipe-hint">
      <span>&lt;</span><span>&lt;</span><span>&lt;</span>
    </div>
  </div>

  <!-- SCREEN 2: MENU (SIDEBAR) -->
  <div id="screen-menu">
    <h1 class="title">Comersio - <span class="emas">Center</span></h1>

    <div class="menu-wrap">
      <a href="customer.html" class="menu-btn" data-name="Nama & ID Customer">
        <img src="nama.png" alt="">
        <span>Nama & ID Customer</span>
      </a>
      <a href="product.html" class="menu-btn" data-name="Produk">
        <img src="voucher.png" alt="">
        <span>Produk</span>
      </a>
      <a href="debt.html" class="menu-btn" data-name="Rekap Utang (Per Customer)">
        <img src="debt.png" alt="">
        <span>Rekap Utang<br>(Per Customer)</span>
      </a>
      <a href="monthly.html" class="menu-btn" data-name="Pembukuan Bulanan">
        <img src="pembukuan.png" alt="">
        <span>Pembukuan Bulanan</span>
      </a>
      <a href="recap.html" class="menu-btn" data-name="Rekap Utang Total">
        <img src="rekap.png" alt="">
        <span>Rekap Utang Total</span>
      </a>

      <!-- SAVE DATA -->
      <div class="menu-btn" onclick="saveComersioData()" style="cursor:pointer;">
        <img src="icon.png" alt="">
        <span>Save Data</span>
      </div>

      <!-- LOAD DATA -->
      <div class="menu-btn" onclick="document.getElementById('loadFile').click()" style="cursor:pointer;">
        <img src="icon.png" alt="">
        <span>Load Data</span>
      </div>
      <input type="file" id="loadFile" accept=".ayj" hidden>

      <!-- LOGOUT -->
      <div class="menu-btn" onclick="logoutComersio()" style="cursor:pointer; border-color: var(--emas);">
        <img src="icon.png" alt="">
        <span>Logout</span>
      </div>
    </div>

    <div class="back-hint">Swipe ke kanan untuk kembali</div>
  </div>

  <script>
    const username = localStorage.getItem("username");
    if(!username){
        window.location.href = "login.html";
    }

    const welcome = document.getElementById('screen-welcome');
    const menu = document.getElementById('screen-menu');
    let isMenuOpen = false;

    function openMenu(){
      welcome.classList.add('slide-out');
      menu.classList.add('slide-in');
      isMenuOpen = true;
    }

    function closeMenu(){
      welcome.classList.remove('slide-out');
      menu.classList.remove('slide-in');
      isMenuOpen = false;
    }

    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    window.addEventListener('touchend', (e) => {
      let touchEndX = e.changedTouches[0].screenX;
      let touchEndY = e.changedTouches[0].screenY;
      
      let diffX = touchEndX - touchStartX;
      let diffY = touchEndY - touchStartY;

      if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0 && !isMenuOpen) {
          openMenu();
        } else if (diffX > 0 && isMenuOpen) {
          closeMenu();
        }
      }
    }, {passive: true});

    let mouseStartX = 0;
    let isMouseDown = false;

    window.addEventListener('mousedown', (e) => {
      mouseStartX = e.clientX;
      isMouseDown = true;
    });

    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      let diffX = e.clientX - mouseStartX;
      if (Math.abs(diffX) > 50) {
        if (diffX < 0 && !isMenuOpen) {
          openMenu();
        } else if (diffX > 0 && isMenuOpen) {
          closeMenu();
        }
      }
      isMouseDown = false;
    });

    document.querySelectorAll('.menu-btn').forEach(btn => {
      if(btn.hasAttribute('href')){
        btn.addEventListener('click', function(e){
          e.preventDefault();
          const href = this.getAttribute('href');
          this.classList.add('bounce');
          setTimeout(() => {
            window.location.href = href;
          }, 320);
        });
      }
    });

    function saveComersioData(){
        const data = {
            customers: JSON.parse(localStorage.getItem("customers")) || [],
            debts: JSON.parse(localStorage.getItem("debts")) || {},
            products: JSON.parse(localStorage.getItem("products")) || [],
            monthly: JSON.parse(localStorage.getItem("monthly")) || []
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "Comersio.ayj";
        link.click();
    }

    document.getElementById("loadFile").addEventListener("change", function(e){
        const file = e.target.files[0];
        if(!file) return;

        const reader = new FileReader();
        reader.onload = function(event){
            try{
                const data = JSON.parse(event.target.result);
                localStorage.setItem("customers", JSON.stringify(data.customers || []));
                localStorage.setItem("debts", JSON.stringify(data.debts || {}));
                localStorage.setItem("products", JSON.stringify(data.products || []));
                localStorage.setItem("monthly", JSON.stringify(data.monthly || []));

                alert("Data berhasil di load!");
                location.reload();
            }catch{
                alert("File bukan Comersio.ayj");
            }
        };
        reader.readAsText(file);
    });

    function logoutComersio(){
        localStorage.removeItem("username");
        localStorage.removeItem("email");
        localStorage.removeItem("title");
        window.location.href = "login.html";
    }
  </script>

</body>
</html>
